<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tripslop</title>
<link rel="icon" href="favicon.svg">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0912; color: #e9dcc9;
    font: 15px/1.5 system-ui, sans-serif; }
  /* eframe sizes the canvas to its parent. */
  #tripslop { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1rem;
    align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
  #loading img { width: min(360px, 80vw); }
  #loading.error p { max-width: 36rem; }
  #loading .note { opacity: 0.6; font-size: 13px; max-width: 36rem; }
  #loading a { color: #f2a65a; }
</style>
</head>
<body>
<canvas id="tripslop"></canvas>
<div id="loading">
  <img src="wordmark.svg" alt="tripslop">
  <p>Loading…</p>
  <p class="note">The browser version is a demo: no video files, cameras, recording, audio input or
    MIDI. Drop images, shaders (.glsl, .frag, .fs, .wgsl) or 3D models onto the grid.
    For everything, download the desktop app.</p>
</div>
<script type="module">
  import init from "./tripslop.js";
  init().catch((e) => {
    const el = document.getElementById("loading");
    // The app reports its own start-up errors; this catches the wasm failing to load at all.
    if (el && !el.classList.contains("error")) {
      el.className = "error";
      el.innerHTML = "<p>tripslop couldn't load: " + e + "</p>";
    }
  });
</script>
</body>
</html>
