[package]
name = "trippy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
pollster = "1.0.1"
rfd = "0.17.2"
serde_json = "1.0.151"
